<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Student Course Registration System</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/auth.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="login.html">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Zm-6 9.2v4.1c0 1.7 2.7 3.2 6 3.2s6-1.5 6-3.2v-4.1l-6 3.3-6-3.3Z"/></svg>
      <span>Course Registration</span>
    </a>
    <nav aria-label="Primary">
      <a class="nav-link" href="signup.html">Create Account</a>
    </nav>
  </header>

  <main class="auth-main">
    <section class="glass-card" aria-labelledby="login-title">
      <h1 id="login-title">Welcome Back</h1>
      <p class="card-subtitle">Sign in to your university account to continue.</p>

      <form id="login-form" data-form="login" novalidate>
        <div class="form-message" role="alert" aria-live="polite" hidden></div>

        <fieldset class="role-selector">
          <legend>Sign in as</legend>
          <div class="role-options">
          <label class="role-option">
            <input type="radio" name="role" value="student" checked>
            <span>Student</span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="administrator">
            <span>Administrator</span>
          </label>
          </div>
        </fieldset>

        <div class="form-field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="name@university.edu" aria-describedby="email-error">
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="password-error">
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
          </div>
          <p class="field-error" id="password-error"></p>
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <p class="card-footer">New student? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
