<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signed In | Student Course Registration System</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/auth.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="dashboard.html">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Zm-6 9.2v4.1c0 1.7 2.7 3.2 6 3.2s6-1.5 6-3.2v-4.1l-6 3.3-6-3.3Z"/></svg>
      <span>Course Registration</span>
    </a>
    <nav aria-label="Primary">
      <button type="button" class="btn btn-ghost" data-action="logout">Logout</button>
    </nav>
  </header>

  <main class="auth-main">
    <section class="glass-card glass-card--center" aria-labelledby="welcome-title">
      <h1 id="welcome-title">Welcome, <span id="user-name">User</span></h1>
      <p class="card-subtitle">You are signed in as</p>
      <p class="role-badge" id="user-role">Student</p>
      <p class="card-note">This is a placeholder page that demonstrates the demo login and logout flow.</p>
      <button type="button" class="btn btn-primary" data-action="logout">Logout</button>
    </section>
  </main>
</body>
</html>
