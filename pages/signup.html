<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Student Course Registration System</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/auth.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="login.html">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Zm-6 9.2v4.1c0 1.7 2.7 3.2 6 3.2s6-1.5 6-3.2v-4.1l-6 3.3-6-3.3Z"/></svg>
      <span>Course Registration</span>
    </a>
    <nav aria-label="Primary">
      <a class="nav-link" href="login.html">Sign In</a>
    </nav>
  </header>

  <main class="auth-main">
    <section class="glass-card" aria-labelledby="signup-title">
      <h1 id="signup-title">Create Account</h1>
      <p class="card-subtitle">Student registration. Fill in your details to get started.</p>

      <form id="signup-form" data-form="signup" novalidate>
        <div class="form-message" role="alert" aria-live="polite" hidden></div>

        <div class="form-field">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName" autocomplete="name" placeholder="Your full name" aria-describedby="full-name-error">
          <p class="field-error" id="full-name-error"></p>
        </div>

        <div class="form-field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="name@university.edu" aria-describedby="email-error">
          <p class="field-error" id="email-error"></p>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" aria-describedby="password-error">
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
          </div>
          <p class="field-error" id="password-error"></p>
        </div>

        <div class="form-field">
          <label for="confirm-password">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" placeholder="Re-enter your password" aria-describedby="confirm-password-error">
            <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password">Show</button>
          </div>
          <p class="field-error" id="confirm-password-error"></p>
        </div>

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <p class="card-footer">Already have an account? <a href="login.html">Back to Sign In</a></p>
    </section>
  </main>
</body>
</html>
